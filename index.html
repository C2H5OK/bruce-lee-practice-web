<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111416"><link rel="icon" href="data:,"><link rel="stylesheet" href="game.css"><title>Bruce Lee · Practice</title></head><body><main>
<header><h1>Bruce Lee <small>Practice</small></h1><button id="toggle" disabled>Start</button></header>
<div class="stage"><canvas id="screen" aria-label="Bruce Lee game screen" width="320" height="224"></canvas></div>
